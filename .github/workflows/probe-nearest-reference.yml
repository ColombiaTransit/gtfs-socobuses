name: Probe nearest Socobuses reference points
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing route details artifact run"
        required: true
        default: "41317058217"
      max_requests:
        description: "Number of sample coordinates (max 40)"
        required: true
        default: "18"
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: socobuses-api-probe
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source/
      - name: Probe a small GPS sample
        run: |
          test -s source/route_details.json
          python scripts/probe_nearest_reference.py --source source/route_details.json --max-requests "${{ inputs.max_requests }}"
      - uses: actions/upload-artifact@v4
        with:
          name: socobuses-nearest-reference-probe
          path: output/nearest-reference-probe.json
          if-no-files-found: error
