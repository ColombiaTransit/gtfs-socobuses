name: Map Socobuses reference coverage
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Route details and reference points run"
        required: true
        default: "41317058217"
      previous_run_id:
        description: "Previous nearest-reference probe run"
        required: true
        default: "41319495061"
      max_requests:
        description: "Maximum new API probes"
        required: true
        default: "1800"
      spacing_m:
        description: "Route geometry sampling interval in metres"
        required: true
        default: "120"
permissions:
  contents: read
  actions: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: socobuses-api-probe
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source/
      - uses: actions/download-artifact@v4
        with:
          name: socobuses-nearest-reference-probe
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ github.token }}
          path: previous/
      - name: Discover reference IDs along route geometries
        run: |
          python scripts/probe_reference_coverage.py \
            --source source/route_details.json \
            --references source/reference_points.json \
            --previous previous/nearest-reference-probe.json \
            --max-requests "${{ inputs.max_requests }}" \
            --spacing-m "${{ inputs.spacing_m }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socobuses-reference-coverage
          path: output/reference-coverage.json
          if-no-files-found: warn
