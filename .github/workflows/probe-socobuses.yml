name: Probe Socobuses API (manual)

on:
  workflow_dispatch:
    inputs:
      details_only:
        description: "Download details for already discovered routes only"
        type: boolean
        default: true
      download_all:
        description: "Attempt all origins and valid destinations (limited to 500 requests per run)"
        type: boolean
        default: true
      max_requests:
        description: "Maximum API requests per run (1-1000)"
        default: "500"
        required: true
      origin_offset:
        description: "Start index of origin batch"
        default: "0"
        required: true
      max_origins:
        description: "Sampled origins (1-20)"
        default: "12"
        required: true
      max_destinations:
        description: "Destinations per origin (1-20)"
        default: "12"
        required: true
      max_routes:
        description: "Maximum cached route details (1-100)"
        default: "50"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Restore API cache
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: socobuses-probe-${{ github.run_id }}
          restore-keys: |
            socobuses-probe-
      - name: Probe Socobuses
        env:
          DOWNLOAD_ALL: ${{ inputs.download_all }}
          DETAILS_ONLY: ${{ inputs.details_only }}
        run: |
          FLAGS=""
          if [ "$DOWNLOAD_ALL" = "true" ]; then FLAGS="--all"; fi
          if [ "$DETAILS_ONLY" = "true" ]; then FLAGS="--details-only"; fi
          python scripts/probe_socobuses.py $FLAGS \
            --max-requests "${{ inputs.max_requests }}" \
            --origin-offset "${{ inputs.origin_offset }}" \
            --max-origins "${{ inputs.max_origins }}" \
            --max-destinations "${{ inputs.max_destinations }}" \
            --max-routes "${{ inputs.max_routes }}"
      - name: Save API cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: cache/
          key: socobuses-probe-${{ github.run_id }}
      - name: Upload raw API responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socobuses-api-probe
          path: output/
          if-no-files-found: warn
          retention-days: 14
